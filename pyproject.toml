[project]
name = "pipeline"
version = "0.1.0"
description = "Telegram channel -> web research -> Instagram carousel pipeline"
requires-python = ">=3.13"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.13",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "jinja2>=3.1",
    "playwright>=1.47",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    # Imported at runtime (not just by tests): pillow decodes/size-checks every
    # downloaded image (safe_download.py, search.py); jsonschema validates LLM
    # output (llm.py). Both import inside try/except, so omitting them fails silently.
    "pillow>=10.4",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff==0.16.8",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"

# T79 (D33): with no [tool.ruff] section at all, `uvx ruff` resolves its FULL
# rule set (every plugin, not the documented E4/E7/E9/F default) against
# whatever version is newest at invocation -- 151 findings on this tree under
# 0.16.8, a different count under every other version. Pinning the version
# above makes the tool reproducible; this `select` makes the rule set
# reproducible too, so a finding count means the same thing in every session.
#
# Selected now (0 findings on this tree as of 2026-09-23, pinned ruff 0.16.8):
#   E4  import errors (e.g. module-level import not at top)
#   E7  statement errors (e.g. bare `except:`, `== None`)
#   E9  runtime/syntax errors ruff can catch statically
#   F   pyflakes -- undefined names, unused imports/variables, redefinitions
# This is ruff's own documented "sane default" and catches real bugs, not
# style opinions -- the right floor to gate on before tightening further.
#
# Deliberately deferred (not selected), each because it is not clean today
# and fixing it is a separate, scoped task rather than a lint-config drive-by:
#   BLE001    blind `except Exception` (36 hits) -- overlaps errors.py's
#             taxonomy (pipeline/errors.py, owned elsewhere right now);
#             narrowing each one is a per-site judgement call, not a config.
#   RUF100    unused `# noqa` (47 hits, mostly `# noqa: E402` on the
#             `sys.path.insert` import pattern in scripts/ -- worth a follow-up
#             cleanup, not a blocker for standing the gate up).
#   I001      import sorting (15 hits) -- real but its `--fix` touches import
#             order tree-wide; do separately from this config-only change.
#   UP017/UP041/UP035  pyupgrade modernisations (20 hits combined).
#   ISC004, C408, SIM114, FURB167, PLW1510, RUF010, SIM118, SIM103, RUF059
#             (1-4 hits each) -- minor style/simplification suggestions.
#   E501      line length (209 hits) -- not selected above (E4/E7/E9/F only),
#             and not a `select` gap either: enforcing it is a wrap-every-line
#             drive-by across the tree, the same shape of change I001 is.
# Also out of scope, and not a `[tool.ruff.lint]` line at all:
#   `ruff format --check` -- 74 of 92 files would be reformatted today.
#   Same reason as I001/E501: reformatting 74 files while several branches
#   have those same files open would be a conflict bomb, not a lint fix.
# Named here so "0 findings" reads as "clean within what's selected", not
# "clean" -- both counts reproduced with the pin above, same date.
# Tighten by moving a category from this list into `select` once its current
# findings are fixed (or explicitly `ignore`d with a reason) in its own task.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
