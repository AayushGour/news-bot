[project]
name = "pipeline"
version = "0.1.0"
description = "Telegram channel -> web research -> Instagram carousel pipeline"
requires-python = ">=3.13"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.13",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "jinja2>=3.1",
    "playwright>=1.47",
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pillow>=10.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
