use_default_settings: true

server:
  secret_key: "change-me-in-env"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  # Retry once on a transient upstream error before giving up on an engine.
  retries: 1

search:
  safe_search: 0
  # The JSON API is why SearXNG is self-hosted: public instances do not expose
  # it and rate-limit automated traffic.
  formats:
    - html
    - json
  # An engine that has not answered in this long is dropped from the result set
  # rather than holding up the whole query.
  default_lang: "en"

engines:
  # --- general web. DuckDuckGo, Brave and Startpage all CAPTCHA under
  # sustained automated querying, which zeroed out research entirely. They stay
  # enabled because they work again once the block lapses, but the engines
  # below are the ones that keep results flowing meanwhile.
  # bing carries the general web on this instance. It is disabled in
  # SearXNG's defaults, and it is the only general engine here that still
  # answers: brave, duckduckgo, google cse and startpage are all persistently
  # unresponsive under automated querying, and mojeek returns zero results
  # without even reporting itself unresponsive. Without this line
  # categories=general returned NOTHING on every query, so every news item was
  # researched from the news and it categories alone — which is how MDN and
  # Docker Hub became "sources" for a story about Palantir.
  - name: bing
    disabled: false
    weight: 3
  # Kept but proven inert here: 0 results, and not even flagged unresponsive.
  # Left enabled in case it recovers; no longer relied on.
  - name: mojeek
    disabled: false
    weight: 2
  # marginalia is deliberately absent: the defaults mark it inactive as well as
  # disabled, and disabled:false does not clear inactive, so listing it here
  # loaded nothing at all.
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false

  # --- where tech news and technical detail actually live. These rarely block
  # and are far more likely to carry the code samples and specifications the
  # pipeline needs than a general web engine is.
  - name: hackernews
    disabled: false
    weight: 2
  - name: github
    disabled: false
  # stackexchange is not an engine name — it is the implementation behind
  # stackoverflow, askubuntu and superuser, all three already enabled.
  #
  # arxiv and reddit are enabled but live in the "science" and "social media"
  # categories, which DEFAULT_CATEGORIES never queries. Reaching them needs an
  # explicit engines= parameter, the same lever that finally reached github.
  - name: stackoverflow
    disabled: false
